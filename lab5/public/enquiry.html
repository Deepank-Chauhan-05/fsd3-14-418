```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Bluetooth Hub</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 85% 10%, rgba(59,130,246,.18), transparent 30%),
                radial-gradient(circle at 10% 80%, rgba(14,165,233,.10), transparent 30%),
                #070b14;
            color: #f8fafc;
            min-height: 100vh;
        }

        nav {
            height: 75px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,.07);
            background: rgba(7,11,20,.75);
            backdrop-filter: blur(15px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .logo {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #2563eb;
            box-shadow: 0 0 25px rgba(37,99,235,.4);
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: #60a5fa;
        }

        main {
            width: 86%;
            max-width: 1000px;
            margin: auto;
            padding: 80px 0;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(96,165,250,.25);
            border-radius: 30px;
            color: #93c5fd;
            font-size: 12px;
        }

        h1 {
            font-size: clamp(42px, 6vw, 60px);
            letter-spacing: -3px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #60a5fa;
        }

        .hero p {
            color: #94a3b8;
            font-size: 15px;
        }

        .form-card {
            max-width: 650px;
            margin: auto;
            padding: 40px;

            border-radius: 22px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(15,23,42,.65);
            backdrop-filter: blur(15px);

            box-shadow: 0 25px 60px rgba(0,0,0,.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;

            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.08);

            background: rgba(7,11,20,.7);
            color: white;

            outline: none;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3b82f6;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        select option {
            background: #0f172a;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-family: inherit;
            font-weight: 600;

            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #3b82f6;
            box-shadow: 0 10px 25px rgba(37,99,235,.25);
        }

        footer {
            padding: 25px 7%;
            border-top: 1px solid rgba(255,255,255,.07);
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .nav-links {
                gap: 12px;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="brand">
            <div class="logo">ᛒ</div>
            Bluetooth Hub
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="enquiry.html" class="active">Enquiry</a>
        </div>

    </nav>


    <main>

        <section class="hero">

            <div class="badge">GET IN TOUCH</div>

            <h1>
                Have an <span>enquiry?</span>
            </h1>

            <p>
                Have a question, suggestion, or need help?
                Send us a message.
            </p>

        </section>


        <section class="form-card">

            <form onsubmit="submitForm(event)">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Enquiry Type
                    </label>

                    <select id="subject" required>

                        <option value="">
                            Select enquiry type
                        </option>

                        <option>
                            General Question
                        </option>

                        <option>
                            Technical Support
                        </option>

                        <option>
                            Bluetooth Device
                        </option>

                        <option>
                            Feedback
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        Your Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your enquiry here..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Enquiry →
                </button>

            </form>

        </section>

    </main>


    <footer>
        © 2026 Bluetooth Hub — Wireless connectivity, simplified.
    </footer>


    <script>

        function submitForm(event) {

            event.preventDefault();

            const button = document.querySelector("button");

            button.textContent = "✓ Enquiry Sent";

            button.style.background = "#166534";

            setTimeout(function () {

                button.textContent = "Send Enquiry →";
                button.style.background = "#2563eb";

                document.querySelector("form").reset();

            }, 2000);
        }

    </script>

</body>

</html>
```
